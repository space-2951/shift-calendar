<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シフト(手動入力版)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 30px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .controls {
    width: 480px;
    max-width: 100%;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: #2d6a4f; font-weight: 700; }
  .controls input, .controls select.ym-select {
    font-family: 'Noto Sans JP', sans-serif;
    border: 1px solid #cfe3d8;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 14px;
    color: #333;
  }
  .controls input[type=number] { width: 80px; }
  .controls button {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #2d6a4f, #40916c);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .controls button:hover { opacity: 0.9; }
  .controls .hint {
    width: 100%;
    font-size: 12px;
    color: #888;
    font-weight: 400;
  }

  .card {
    width: 480px;
    max-width: 100%;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.10);
  }
  .header {
    background: linear-gradient(135deg, #2d6a4f, #40916c);
    color: #fff;
    padding: 18px 20px 16px;
    text-align: center;
  }
  .header .app-title {
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.85;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .header .ym-title {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 8px;
  }
  .header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 4px 16px;
    font-size: 13px;
    font-weight: 700;
  }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 5px;
    table-layout: fixed;
    padding: 12px 12px 4px;
  }
  th {
    width: 14.28%;
    font-size: 12px;
    color: #666;
    font-weight: 700;
    padding-bottom: 4px;
  }
  td {
    width: 14.28%;
    height: 80px;
    border-radius: 8px;
    text-align: center;
    vertical-align: middle;
    font-size: 14px;
    color: #333;
    background: #f4f6f4;
    position: relative;
    padding: 4px 2px;
  }
  td.empty { background: transparent; }
  td.sun .daynum { color: #ff3b3b; }
  td.sat .daynum { color: #1d4e89; }
  td.sun { background: #fef9f9; }
  td.sat { background: #f6f9fe; }
  td.attend { background: #40916c; }
  td.attend .daynum { color: #fff; font-weight: 700; }
  .daynum { display: block; font-size: 16px; margin-bottom: 2px; }
  .holiday-label {
    display: block;
    height: 20px;
    font-size: 8px;
    color: #ff3b3b;
    font-weight: 500;
    line-height: 1.15;
    margin-bottom: 2px;
    overflow: hidden;
  }
  select.day-select {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 10px;
    border-radius: 4px;
    border: 1px solid #ccc;
    width: 90%;
    padding: 1px 0;
    background: #fff;
    color: #333;
  }
  td.attend select.day-select {
    background: rgba(255,255,255,0.85);
  }
  select.day-select option[value="attend"] {
    font-weight: 700;
  }
  .footer {
    background: #f8faf9;
    padding: 12px 20px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend-box {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    background: #40916c;
  }
  .legend-text { font-size: 15px; color: #333; }
  .line-share-wrap {
    padding: 0 20px 18px;
    background: #f8faf9;
  }
  .line-share-btn {
    width: 100%;
    font-family: 'Noto Sans JP', sans-serif;
    background: #06c755;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .line-share-btn:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="controls">
  <label>年</label>
  <input type="number" id="yearInput" value="2026" min="2000" max="2099">
  <label>月</label>
  <select class="ym-select" id="monthInput"></select>
  <button onclick="render()">カレンダー表示</button>
  <div class="hint">各日のプルダウンで「通所」を選ぶと通所日として色がつきます</div>
</div>

<div class="card" id="card"></div>

<script>
const monthSelect = document.getElementById('monthInput');
for (let m=1;m<=12;m++){
  const opt = document.createElement('option');
  opt.value = m;
  opt.textContent = m + '月';
  monthSelect.appendChild(opt);
}

function pad(n){ return n.toString().padStart(2,'0'); }

function getEquinox(year, isSpring){
  const base = isSpring ? 20.8431 : 23.2488;
  return Math.floor(base + 0.242194*(year-1980) - Math.floor((year-1980)/4));
}

function nthWeekday(year, month, weekday, n){
  const d = new Date(year, month-1, 1);
  const dow = d.getDay();
  let firstOccurrence = 1 + ((weekday - dow + 7) % 7);
  return firstOccurrence + (n-1)*7;
}

function getHolidays(year){
  const h = {};
  const add = (m,d,name) => {
    if (d < 1) return;
    const dt = new Date(year, m-1, d);
    if (dt.getMonth() !== m-1) return;
    h[`${year}-${pad(m)}-${pad(d)}`] = name;
  };

  add(1,1,'元日');
  add(1, nthWeekday(year,1,1,2), '成人の日');
  add(2,11,'建国記念の日');
  if (year>=2020) add(2,23,'天皇誕生日');
  add(3, getEquinox(year,true), '春分の日');
  add(4,29,'昭和の日');
  add(5,3,'憲法記念日');
  add(5,4,'みどりの日');
  add(5,5,'こどもの日');

  if (year===2020) add(7,23,'海の日');
  else if (year===2021) add(7,22,'海の日');
  else add(7, nthWeekday(year,7,1,3), '海の日');

  if (year===2020) add(7,24,'スポーツの日');
  else if (year===2021) add(7,23,'スポーツの日');
  else if (year>=2020) add(10, nthWeekday(year,10,1,2), 'スポーツの日');
  else if (year>=2000) add(10, nthWeekday(year,10,1,3), '体育の日');

  if (year===2020) add(8,10,'山の日');
  else if (year===2021) add(8,8,'山の日');
  else if (year>=2016) add(8,11,'山の日');

  add(9, nthWeekday(year,9,1,3), '敬老の日');
  add(9, getEquinox(year,false), '秋分の日');
  add(11,3,'文化の日');
  add(11,23,'勤労感謝の日');

  const allDates = Object.keys(h).sort();
  for (const key of allDates){
    const d = new Date(key);
    const nextDay = new Date(d); nextDay.setDate(d.getDate()+1);
    const nextKey = `${nextDay.getFullYear()}-${pad(nextDay.getMonth()+1)}-${pad(nextDay.getDate())}`;
    const dayAfter = new Date(d); dayAfter.setDate(d.getDate()+2);
    const dayAfterKey = `${dayAfter.getFullYear()}-${pad(dayAfter.getMonth()+1)}-${pad(dayAfter.getDate())}`;
    if (h[key] && h[dayAfterKey] && !h[nextKey] && nextDay.getDay()!==0){
      h[nextKey] = '国民の休日';
    }
  }

  const holidayKeys = Object.keys(h).sort();
  for (const key of holidayKeys){
    const d = new Date(key);
    if (d.getDay()===0){
      let sub = new Date(d);
      do {
        sub.setDate(sub.getDate()+1);
        const subKey = `${sub.getFullYear()}-${pad(sub.getMonth()+1)}-${pad(sub.getDate())}`;
        if (!h[subKey]){ h[subKey] = '振替休日'; break; }
      } while (true);
    }
  }
  return h;
}

function buildWeeks(year, month){
  const firstDay = new Date(year, month-1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstDow = firstDay.getDay();
  const weeks = [];
  let current = new Array(firstDow).fill(null);
  for (let d=1; d<=daysInMonth; d++){
    current.push(d);
    if (current.length===7){ weeks.push(current); current=[]; }
  }
  if (current.length>0){
    while (current.length<7) current.push(null);
    weeks.push(current);
  }
  return weeks;
}

function updateBadgeCount(){
  const count = document.querySelectorAll('select.day-select').length
    ? Array.from(document.querySelectorAll('select.day-select')).filter(s => s.value==='attend').length
    : 0;
  const badge = document.getElementById('badgeCount');
  if (badge) badge.textContent = count;
}

function toggleCell(selectEl){
  const td = selectEl.closest('td');
  if (selectEl.value === 'attend') {
    td.classList.add('attend');
    selectEl.style.fontWeight = '700';
  } else {
    td.classList.remove('attend');
    selectEl.style.fontWeight = '400';
  }
  updateBadgeCount();
}

function render(){
  const year = parseInt(document.getElementById('yearInput').value, 10);
  const month = parseInt(document.getElementById('monthInput').value, 10);
  const weeks = buildWeeks(year, month);
  const holidays = getHolidays(year);
  const dayHeaders = ['日','月','火','水','木','金','土'];

  let tableRows = '';
  weeks.forEach(week => {
    let row = '<tr>';
    week.forEach((day, idx) => {
      if (day===null){
        row += '<td class="empty"></td>';
        return;
      }
      const key = `${year}-${pad(month)}-${pad(day)}`;
      const holidayName = holidays[key];
      let cls = '';
      if (idx===0) cls = 'sun';
      else if (idx===6) cls = 'sat';
      let inner = `<span class="holiday-label">${holidayName ? holidayName : ''}</span>`;
      inner += `<span class="daynum">${day}</span>`;
      inner += `<select class="day-select" onchange="toggleCell(this)"><option value="">－</option><option value="attend">出</option></select>`;
      row += `<td class="${cls}">${inner}</td>`;
    });
    row += '</tr>';
    tableRows += row;
  });

  const headerRow = '<tr>' + dayHeaders.map(h => `<th>${h}</th>`).join('') + '</tr>';

  document.getElementById('card').innerHTML = `
    <div class="header">
      <div class="app-title">シフト</div>
      <div class="ym-title">${year}年${month}月</div>
      <div class="badge">通所日 全<span id="badgeCount">0</span>日</div>
    </div>
    <table>
      <thead>${headerRow}</thead>
      <tbody>${tableRows}</tbody>
    </table>
    <div class="footer">
      <div class="legend-box"></div>
      <div class="legend-text">通所日</div>
    </div>
    <div class="line-share-wrap">
      <button class="line-share-btn" onclick="sendToLine()">LINEで送信</button>
    </div>
  `;
}

// ==== LIFF 連携 ====
// ① このHTMLを公開したURLをLINE Developersコンソールで「LIFFアプリ」として登録
// ② 発行された LIFF ID を下の 'YOUR_LIFF_ID' に置き換える
const LIFF_ID = '2010732069-ROoavlFb';

async function initLiff(){
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    console.log('LIFF初期化前(通常のブラウザで確認中の場合はこのメッセージが出ます)', e);
  }
}
initLiff();

function buildShiftFlex(){
  const year = parseInt(document.getElementById('yearInput').value, 10);
  const month = parseInt(document.getElementById('monthInput').value, 10);

  const table = document.querySelector('#card table');
  const rows = table.querySelectorAll('tbody tr');
  const dayHeaders = ['日','月','火','水','木','金','土'];

  let attendCount = 0;

  const headerRow = {
    type: 'box',
    layout: 'horizontal',
    spacing: 'xs',
    contents: dayHeaders.map((label, idx) => ({
      type: 'text',
      text: label,
      size: 'xs',
      align: 'center',
      color: idx===0 ? '#ff3b3b' : (idx===6 ? '#1d4e89' : '#666666'),
      flex: 1
    }))
  };

  const weekRows = Array.from(rows).map(tr => {
    const cells = Array.from(tr.querySelectorAll('td'));
    const cellBoxes = cells.map(td => {
      if (td.classList.contains('empty')) {
        return {
          type: 'box',
          layout: 'vertical',
          flex: 1,
          paddingAll: '2px',
          contents: [
            { type: 'box', layout: 'vertical', height: '24px', contents: [{ type: 'text', text: ' ', size: 'xxs' }] },
            { type: 'text', text: ' ', size: 'sm' }
          ]
        };
      }
      const daynumEl = td.querySelector('.daynum');
      const holidayEl = td.querySelector('.holiday-label');
      const daynum = daynumEl ? daynumEl.textContent : '';
      const holidayText = holidayEl ? holidayEl.textContent.trim() : '';
      const isAttend = td.classList.contains('attend');
      const isSun = td.classList.contains('sun');
      const isSat = td.classList.contains('sat');
      if (isAttend) attendCount++;

      let dayColor = '#333333';
      if (isAttend) dayColor = '#ffffff';
      else if (isSun) dayColor = '#ff3b3b';
      else if (isSat) dayColor = '#1d4e89';

      let bg = '#f4f6f4';
      if (isAttend) bg = '#40916c';
      else if (isSun) bg = '#fef9f9';
      else if (isSat) bg = '#f6f9fe';

      return {
        type: 'box',
        layout: 'vertical',
        flex: 1,
        backgroundColor: bg,
        cornerRadius: '4px',
        paddingAll: '2px',
        contents: [
          { type: 'box', layout: 'vertical', height: '24px', contents: [
            { type: 'text', text: holidayText || ' ', size: '6px', color: '#ff3b3b', align: 'center', wrap: true, maxLines: 2 }
          ]},
          { type: 'text', text: daynum, size: 'sm', align: 'center', color: dayColor, weight: isAttend ? 'bold' : 'regular' }
        ]
      };
    });
    return { type: 'box', layout: 'horizontal', spacing: 'xs', margin: 'sm', contents: cellBoxes };
  });

  // run once to count attend cells before building altText
  const tempCount = document.querySelectorAll('#card td.attend').length;

  const altText = `【シフト】${year}年${month}月 通所日 全${tempCount}日`;

  return {
    type: 'flex',
    altText: altText,
    contents: {
      type: 'bubble',
      size: 'giga',
      header: {
        type: 'box',
        layout: 'vertical',
        backgroundColor: '#2d6a4f',
        paddingAll: '16px',
        contents: [
          { type: 'text', text: 'シフト', color: '#ffffff', size: 'xs', weight: 'bold' },
          { type: 'text', text: `${year}年${month}月`, color: '#ffffff', size: 'xl', weight: 'bold', margin: 'sm' },
          { type: 'text', text: `通所日 全${tempCount}日`, color: '#ffffff', size: 'xs', margin: 'sm' }
        ]
      },
      body: {
        type: 'box',
        layout: 'vertical',
        paddingAll: '12px',
        contents: [headerRow, ...weekRows]
      }
    }
  };
}

function sendToLine(){
  if (typeof liff === 'undefined' || !liff.isLoggedIn || !liff.isApiAvailable) {
    alert('LINEアプリ内でLIFFとして開いた場合のみ送信できます。');
    return;
  }
  if (!liff.isApiAvailable('shareTargetPicker')) {
    alert('この環境では送信機能が利用できません。');
    return;
  }
  const flexMessage = buildShiftFlex();
  liff.shareTargetPicker([flexMessage]).then(res => {
    if (res) {
      alert('送信しました');
    }
  }).catch(err => {
    console.error(err);
    alert('送信に失敗しました');
  });
}

document.getElementById('yearInput').value = 2026;
monthSelect.value = 7;
render();
</script>
</body>
</html>
