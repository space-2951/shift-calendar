<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト(手動入力版)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 30px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .controls {
    width: 480px;
    max-width: 100%;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: #2d6a4f; font-weight: 700; }
  .controls input, .controls select.ym-select {
    font-family: 'Noto Sans JP', sans-serif;
    border: 1px solid #cfe3d8;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 14px;
    color: #333;
  }
  .controls input[type=number] { width: 80px; }
  .controls button {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #2d6a4f, #40916c);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .controls button:hover { opacity: 0.9; }
  .controls .hint {
    width: 100%;
    font-size: 12px;
    color: #888;
    font-weight: 400;
  }

  .card {
    width: 480px;
    max-width: 100%;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(45,106,79,0.14);
    border: 1px solid #e3efe8;
    position: relative;
  }
  .header {
    background: linear-gradient(135deg, #2d6a4f, #40916c);
    color: #fff;
    padding: 20px 20px 18px;
    text-align: center;
    position: relative;
  }
  .header .app-title {
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0.9;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .header .ym-title {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 10px;
  }
  .header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.22);
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 15px;
    font-weight: 700;
  }

  /* 使い方ボタン */
  .howto-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.95);
    color: #2d6a4f;
    border: none;
    border-radius: 20px;
    padding: 7px 12px 7px 10px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    cursor: pointer;
  }
  .howto-btn .q-icon {
    width: 16px; height: 16px;
    background: #2d6a4f;
    color: #fff;
    border-radius: 50%;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .howto-panel {
    background: #fffaf0;
    border-bottom: 2px solid #ffe6b8;
    padding: 16px 20px 18px;
    display: none;
  }
  .howto-panel.open { display: block; }
  .howto-panel-title {
    font-size: 13px;
    font-weight: 900;
    color: #a8760a;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .howto-close {
    font-size: 11px;
    color: #a8760a;
    font-weight: 700;
    background: rgba(168,118,10,0.12);
    border-radius: 12px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .howto-steps { display: flex; flex-direction: column; gap: 9px; }
  .howto-step { display: flex; align-items: flex-start; gap: 10px; }
  .howto-num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #2d6a4f;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .howto-text { font-size: 13.5px; color: #5a4a2a; line-height: 1.5; padding-top: 2px; }
  .howto-text b { color: #2d6a4f; background: #e3f3ea; padding: 0 4px; border-radius: 4px; }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 6px;
    table-layout: fixed;
    padding: 14px 14px 4px;
  }
  th {
    width: 14.28%;
    font-size: 13px;
    color: #666;
    font-weight: 700;
    padding-bottom: 4px;
  }
  td {
    width: 14.28%;
    height: 90px;
    border-radius: 12px;
    text-align: center;
    vertical-align: middle;
    font-size: 14px;
    color: #333;
    background: #eef2ef;
    position: relative;
    padding: 6px 3px;
    border: 2px solid transparent;
  }
  td.empty { background: transparent; }
  td.sun .daynum { color: #d92626; }
  td.sat .daynum { color: #1d4e89; }
  td.sun { background: #fdeeee; }
  td.sat { background: #eef3fb; }
  td.attend { background: #2d6a4f; border-color: #1b4632; }
  td.attend .daynum { color: #fff; font-weight: 700; }
  td.attend .holiday-label { color: #ffe1b8; }
  .daynum { display: block; font-size: 19px; font-weight: 700; margin-bottom: 2px; }
  .holiday-label {
    display: block;
    height: 20px;
    font-size: 9.5px;
    color: #d92626;
    font-weight: 600;
    line-height: 1.15;
    margin-bottom: 2px;
    overflow: hidden;
  }

  /* 出/－ トグルボタン */
  .toggle-wrap {
    display: flex;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.12);
    margin-top: 2px;
  }
  td.attend .toggle-wrap { border-color: rgba(255,255,255,0.5); }
  .toggle-btn {
    flex: 1;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 0;
    background: #fff;
    color: #999;
    font-family: 'Noto Sans JP', sans-serif;
    border: none;
    cursor: pointer;
  }
  .toggle-btn.active { background: #ffd700; color: #2d6a4f; }
  .toggle-btn.active::before { content: '✓ '; }
  td.attend .toggle-btn:not(.active) { background: rgba(255,255,255,0.25); color: rgba(255,255,255,0.7); }

  .footer {
    background: #f8faf9;
    padding: 14px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .legend-wrap { display: flex; align-items: center; gap: 10px; }
  .legend-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #2d6a4f;
    flex-shrink: 0;
  }
  .legend-text { font-size: 15px; color: #333; font-weight: 500; }

  .reset-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #fff;
    color: #b5462f;
    border: 1.5px solid #e8b3a5;
    border-radius: 18px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
  }
  .reset-btn .r-icon { font-size: 13px; }

  .action-area { padding: 10px 20px 18px; }
  .line-share-btn {
    width: 100%;
    font-family: 'Noto Sans JP', sans-serif;
    background: #06c755;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .line-share-btn:hover { opacity: 0.9; }

  .note-wrap {
    padding: 0 20px 14px;
  }
  .note-label {
    display: block;
    font-size: 12px;
    color: #2d6a4f;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .note-textarea {
    width: 100%;
    min-height: 60px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: #333;
    border: 1px solid #cfe3d8;
    border-radius: 8px;
    padding: 8px;
    resize: vertical;
    box-sizing: border-box;
  }

  /* 確認モーダル(全解除/送信前) */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(20,30,25,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    z-index: 20;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    width: 84%;
    background: #fff;
    border-radius: 16px;
    padding: 22px 20px 18px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  .modal-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    font-size: 20px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
  }
  .modal-icon.warn { background: #fdeeee; color: #d92626; }
  .modal-icon.info { background: #e3f3ea; color: #2d6a4f; }
  .modal-title { font-size: 15.5px; font-weight: 900; color: #333; margin-bottom: 8px; }
  .modal-desc { font-size: 12.5px; color: #777; margin-bottom: 16px; line-height: 1.6; }
  .modal-summary {
    background: #f6f9f7;
    border: 1px solid #e3efe8;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    text-align: left;
  }
  .modal-summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #444;
    padding: 3px 0;
  }
  .modal-summary-row b { color: #2d6a4f; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    border: none;
    cursor: pointer;
  }
  .modal-btn.cancel { background: #f0f0f0; color: #666; }
  .modal-btn.danger { background: #d9483a; color: #fff; }
  .modal-btn.confirm { background: #06c755; color: #fff; }
</style>
</head>
<body>

<div class="controls">
  <label>年</label>
  <input type="number" id="yearInput" value="2026" min="2000" max="2099">
  <label>月</label>
  <select class="ym-select" id="monthInput"></select>
  <button onclick="render()">カレンダー表示</button>
  <div class="hint">各日の「出」ボタンを押すと通所日として色がつきます</div>
</div>

<div class="card" id="card"></div>

<script>
const monthSelect = document.getElementById('monthInput');
for (let m=1;m<=12;m++){
  const opt = document.createElement('option');
  opt.value = m;
  opt.textContent = m + '月';
  monthSelect.appendChild(opt);
}

function pad(n){ return n.toString().padStart(2,'0'); }

function getEquinox(year, isSpring){
  const base = isSpring ? 20.8431 : 23.2488;
  return Math.floor(base + 0.242194*(year-1980) - Math.floor((year-1980)/4));
}

function nthWeekday(year, month, weekday, n){
  const d = new Date(year, month-1, 1);
  const dow = d.getDay();
  let firstOccurrence = 1 + ((weekday - dow + 7) % 7);
  return firstOccurrence + (n-1)*7;
}

function getHolidays(year){
  const h = {};
  const add = (m,d,name) => {
    if (d < 1) return;
    const dt = new Date(year, m-1, d);
    if (dt.getMonth() !== m-1) return;
    h[`${year}-${pad(m)}-${pad(d)}`] = name;
  };

  add(1,1,'元日');
  add(1, nthWeekday(year,1,1,2), '成人の日');
  add(2,11,'建国記念の日');
  if (year>=2020) add(2,23,'天皇誕生日');
  add(3, getEquinox(year,true), '春分の日');
  add(4,29,'昭和の日');
  add(5,3,'憲法記念日');
  add(5,4,'みどりの日');
  add(5,5,'こどもの日');

  if (year===2020) add(7,23,'海の日');
  else if (year===2021) add(7,22,'海の日');
  else add(7, nthWeekday(year,7,1,3), '海の日');

  if (year===2020) add(7,24,'スポーツの日');
  else if (year===2021) add(7,23,'スポーツの日');
  else if (year>=2020) add(10, nthWeekday(year,10,1,2), 'スポーツの日');
  else if (year>=2000) add(10, nthWeekday(year,10,1,3), '体育の日');

  if (year===2020) add(8,10,'山の日');
  else if (year===2021) add(8,8,'山の日');
  else if (year>=2016) add(8,11,'山の日');

  add(9, nthWeekday(year,9,1,3), '敬老の日');
  add(9, getEquinox(year,false), '秋分の日');
  add(11,3,'文化の日');
  add(11,23,'勤労感謝の日');

  const allDates = Object.keys(h).sort();
  for (const key of allDates){
    const d = new Date(key);
    const nextDay = new Date(d); nextDay.setDate(d.getDate()+1);
    const nextKey = `${nextDay.getFullYear()}-${pad(nextDay.getMonth()+1)}-${pad(nextDay.getDate())}`;
    const dayAfter = new Date(d); dayAfter.setDate(d.getDate()+2);
    const dayAfterKey = `${dayAfter.getFullYear()}-${pad(dayAfter.getMonth()+1)}-${pad(dayAfter.getDate())}`;
    if (h[key] && h[dayAfterKey] && !h[nextKey] && nextDay.getDay()!==0){
      h[nextKey] = '国民の休日';
    }
  }

  const holidayKeys = Object.keys(h).sort();
  for (const key of holidayKeys){
    const d = new Date(key);
    if (d.getDay()===0){
      let sub = new Date(d);
      do {
        sub.setDate(sub.getDate()+1);
        const subKey = `${sub.getFullYear()}-${pad(sub.getMonth()+1)}-${pad(sub.getDate())}`;
        if (!h[subKey]){ h[subKey] = '振替休日'; break; }
      } while (true);
    }
  }
  return h;
}

function buildWeeks(year, month){
  const firstDay = new Date(year, month-1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const firstDow = firstDay.getDay();
  const weeks = [];
  let current = new Array(firstDow).fill(null);
  for (let d=1; d<=daysInMonth; d++){
    current.push(d);
    if (current.length===7){ weeks.push(current); current=[]; }
  }
  if (current.length>0){
    while (current.length<7) current.push(null);
    weeks.push(current);
  }
  return weeks;
}

function updateBadgeCount(){
  const count = document.querySelectorAll('td.attend').length;
  const badge = document.getElementById('badgeCount');
  if (badge) badge.textContent = count;
}

// 軽い振動フィードバック(対応端末のみ)
function vibrateFeedback(){
  if (navigator.vibrate) {
    navigator.vibrate(15);
  }
}

// 出/－ ボタンを押した時の処理
function setAttend(btnEl, isAttend){
  const td = btnEl.closest('td');
  const wrap = btnEl.closest('.toggle-wrap');
  const buttons = wrap.querySelectorAll('.toggle-btn');
  buttons.forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');

  if (isAttend) {
    td.classList.add('attend');
  } else {
    td.classList.remove('attend');
  }
  vibrateFeedback();
  updateBadgeCount();
}

function render(){
  const year = parseInt(document.getElementById('yearInput').value, 10);
  const month = parseInt(document.getElementById('monthInput').value, 10);
  const weeks = buildWeeks(year, month);
  const holidays = getHolidays(year);
  const dayHeaders = ['日','月','火','水','木','金','土'];

  let tableRows = '';
  weeks.forEach(week => {
    let row = '<tr>';
    week.forEach((day, idx) => {
      if (day===null){
        row += '<td class="empty"></td>';
        return;
      }
      const key = `${year}-${pad(month)}-${pad(day)}`;
      const holidayName = holidays[key];
      let cls = '';
      if (idx===0) cls = 'sun';
      else if (idx===6) cls = 'sat';
      let inner = `<span class="holiday-label">${holidayName ? holidayName : ''}</span>`;
      inner += `<span class="daynum">${day}</span>`;
      inner += `<div class="toggle-wrap">
        <button type="button" class="toggle-btn active" onclick="setAttend(this,false)">－</button>
        <button type="button" class="toggle-btn" onclick="setAttend(this,true)">出</button>
      </div>`;
      row += `<td class="${cls}">${inner}</td>`;
    });
    row += '</tr>';
    tableRows += row;
  });

  const headerRow = '<tr>' + dayHeaders.map(h => `<th>${h}</th>`).join('') + '</tr>';

  document.getElementById('card').innerHTML = `
    <div class="header">
      <button type="button" class="howto-btn" onclick="toggleHowto()"><span class="q-icon">?</span>使い方</button>
      <div class="app-title">シフト</div>
      <div class="ym-title">${year}年${month}月</div>
      <div class="badge">通所日 全<span id="badgeCount">0</span>日</div>
    </div>

    <div class="howto-panel" id="howtoPanel">
      <div class="howto-panel-title">
        使い方
        <span class="howto-close" onclick="toggleHowto()">閉じる ✕</span>
      </div>
      <div class="howto-steps">
        <div class="howto-step"><div class="howto-num">1</div><div class="howto-text">通所する日の<b>「出」</b>を選んでください</div></div>
        <div class="howto-step"><div class="howto-num">2</div><div class="howto-text"><b>緑色</b>になれば選択完了です</div></div>
        <div class="howto-step"><div class="howto-num">3</div><div class="howto-text">選んだ日数は<b>上部</b>に自動でカウント表示されます</div></div>
        <div class="howto-step"><div class="howto-num">4</div><div class="howto-text">最後に<b>下部</b>に表示されている「LINEで送信」を押してください</div></div>
        <div class="howto-step"><div class="howto-num">5</div><div class="howto-text">画面が切り替わったら、<b>宛先を選んで</b>送信してください</div></div>
      </div>
    </div>

    <table>
      <thead>${headerRow}</thead>
      <tbody>${tableRows}</tbody>
    </table>

    <div class="footer">
      <div class="legend-wrap">
        <div class="legend-box"></div>
        <div class="legend-text">通所日</div>
      </div>
      <button type="button" class="reset-btn" onclick="openResetModal()"><span class="r-icon">↺</span>全解除</button>
    </div>

    <div class="note-wrap">
      <label class="note-label">メモ</label>
      <textarea id="noteInput" class="note-textarea" placeholder="伝えたいことがあれば入力してください"></textarea>
    </div>

    <div class="action-area">
      <button type="button" class="line-share-btn" onclick="openSendModal()">LINEで送信</button>
    </div>

    <!-- 全解除 確認モーダル -->
    <div class="modal-overlay" id="resetModal">
      <div class="modal-box">
        <div class="modal-icon warn">!</div>
        <div class="modal-title">全て解除しますか?</div>
        <div class="modal-desc" id="resetModalDesc">選択した通所日がすべて消えます。<br>この操作は元に戻せません。</div>
        <div class="modal-btns">
          <button type="button" class="modal-btn cancel" onclick="closeResetModal()">キャンセル</button>
          <button type="button" class="modal-btn danger" onclick="confirmReset()">解除する</button>
        </div>
      </div>
    </div>

    <!-- 送信前 確認モーダル -->
    <div class="modal-overlay" id="sendModal">
      <div class="modal-box">
        <div class="modal-icon info">📩</div>
        <div class="modal-title">この内容で送信しますか?</div>
        <div class="modal-summary">
          <div class="modal-summary-row"><span>対象月</span><b id="sendSummaryMonth"></b></div>
          <div class="modal-summary-row"><span>通所日</span><b id="sendSummaryCount"></b></div>
          <div class="modal-summary-row"><span>メモ</span><b id="sendSummaryNote"></b></div>
        </div>
        <div class="modal-desc">内容に間違いがなければ「送信する」を押してください。<br>次の画面で宛先を選びます。</div>
        <div class="modal-btns">
          <button type="button" class="modal-btn cancel" onclick="closeSendModal()">戻る</button>
          <button type="button" class="modal-btn confirm" onclick="confirmSend()">送信する</button>
        </div>
      </div>
    </div>
  `;
}

// ==== 使い方パネル ====
function toggleHowto(){
  const panel = document.getElementById('howtoPanel');
  panel.classList.toggle('open');
}

// ==== 全解除 ====
function openResetModal(){
  const count = document.querySelectorAll('td.attend').length;
  const desc = document.getElementById('resetModalDesc');
  desc.innerHTML = `選択した通所日(全${count}日)がすべて消えます。<br>この操作は元に戻せません。`;
  document.getElementById('resetModal').classList.add('show');
}
function closeResetModal(){
  document.getElementById('resetModal').classList.remove('show');
}
function confirmReset(){
  document.querySelectorAll('td.attend').forEach(td => {
    td.classList.remove('attend');
    const buttons = td.querySelectorAll('.toggle-btn');
    buttons.forEach(b => b.classList.remove('active'));
    const minusBtn = td.querySelector('.toggle-btn');
    if (minusBtn) minusBtn.classList.add('active');
  });
  updateBadgeCount();
  vibrateFeedback();
  closeResetModal();
}

// ==== 送信前確認 ====
function openSendModal(){
  const year = parseInt(document.getElementById('yearInput').value, 10);
  const month = parseInt(document.getElementById('monthInput').value, 10);
  const count = document.querySelectorAll('td.attend').length;
  const noteEl = document.getElementById('noteInput');
  const noteText = noteEl ? noteEl.value.trim() : '';

  document.getElementById('sendSummaryMonth').textContent = `${year}年${month}月`;
  document.getElementById('sendSummaryCount').textContent = `全${count}日`;
  document.getElementById('sendSummaryNote').textContent = noteText ? 'あり' : 'なし';

  document.getElementById('sendModal').classList.add('show');
}
function closeSendModal(){
  document.getElementById('sendModal').classList.remove('show');
}
function confirmSend(){
  closeSendModal();
  sendToLine();
}

// ==== LIFF 連携 ====
// ① このHTMLを公開したURLをLINE Developersコンソールで「LIFFアプリ」として登録
// ② 発行された LIFF ID を下の 'YOUR_LIFF_ID' に置き換える
const LIFF_ID = '2010732069-ROoavlFb';

async function initLiff(){
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    console.log('LIFF初期化前(通常のブラウザで確認中の場合はこのメッセージが出ます)', e);
  }
}
initLiff();

function buildShiftText(){
  const year = parseInt(document.getElementById('yearInput').value, 10);
  const month = parseInt(document.getElementById('monthInput').value, 10);
  const dayHeaders = ['日','月','火','水','木','金','土'];

  const table = document.querySelector('#card table');
  const cells = Array.from(table.querySelectorAll('tbody td')).filter(td => !td.classList.contains('empty'));

  const holidays = getHolidays(year);
  const daysInMonth = new Date(year, month, 0).getDate();

  const dayLines = [];
  let attendCount = 0;

  for (let day = 1; day <= daysInMonth; day++){
    const d = new Date(year, month-1, day);
    const dow = dayHeaders[d.getDay()];
    const key = `${year}-${pad(month)}-${pad(day)}`;
    const holidayName = holidays[key];
    const holidaySuffix = holidayName ? `祝:${holidayName}` : '';

    const td = cells.find(c => {
      const daynumEl = c.querySelector('.daynum');
      return daynumEl && parseInt(daynumEl.textContent, 10) === day;
    });
    const isAttend = td ? td.classList.contains('attend') : false;

    if (isAttend) {
      attendCount++;
      dayLines.push(`【${month}/${day}(${dow})${holidaySuffix} 】🟩`);
    }
    // 通所日じゃない日は行を作らない(通所日だけを表示するため)
  }

  const noteEl = document.getElementById('noteInput');
  const noteText = noteEl ? noteEl.value.trim() : '';

  let text = `【シフト】\n${year}年${month}月\n\n`;
  text += dayLines.join('\n');
  text += `\n\n通所日 全${attendCount}日`;

  if (noteText) {
    text += `\n\n【メモ】\n${noteText}`;
  }

  return text;
}

function sendToLine(){
  if (typeof liff === 'undefined' || !liff.isLoggedIn || !liff.isApiAvailable) {
    alert('LINEアプリ内でLIFFとして開いた場合のみ送信できます。');
    return;
  }
  if (!liff.isApiAvailable('shareTargetPicker')) {
    alert('この環境では送信機能が利用できません。');
    return;
  }
  const textMessage = { type: 'text', text: buildShiftText() };
  liff.shareTargetPicker([textMessage]).then(res => {
    if (res) {
      alert('送信しました');
    }
  }).catch(err => {
    console.error(err);
    alert('送信に失敗しました');
  });
}

monthSelect.value = 7;
render();
